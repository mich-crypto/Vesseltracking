name = "vesseltracking"
main = "worker/worker.js"
compatibility_date = "2025-09-01"

# The Worker serves the app from ./public and handles /api/* and /ws itself.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

# Exposes the deployment id and time, so the app can show its version and spot a newer deploy.
[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
# Comma-separated list of sites allowed to use this proxy. Empty allows any origin.
ALLOWED_ORIGINS = ""

# The AisStream.io key is a secret, never a var:
#   npx wrangler secret put AISSTREAM_API_KEY
